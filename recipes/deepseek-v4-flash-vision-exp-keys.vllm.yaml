    - [{ text: "Y", id: 59 }, { text: " Y", id: 894 }]
    - [{ text: "Z", id: 60 }, { text: " Z", id: 1653 }]
readout:
  rung: top_k
  top_k: 20
  permutation: none
provenance:
  author: Felipe Infante de Castro
  created: "2026-09-19"
  status: draft
  launch: "vLLM 0.25.2.dev0+g752a3a504.d20260714; max_model_len 1048576; prefix caching on, 256-token blocks"
