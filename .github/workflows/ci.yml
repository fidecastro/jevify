name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync (core + dev group)
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (unit, guards, sdk acceptance; live tests skip without a backend)
        run: uv run pytest -m "not live and not encoder"
      - name: Install as a tool and run it from another directory
        run: |
          uv tool install .
          cd "${RUNNER_TEMP}"
          jevify --version

  encoder:
    name: encoder extra (ubuntu, py3.12, cpu torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync (core + dev group)
        run: uv sync --locked --group dev
      - name: Add the encoder extra with CPU-only torch
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install transformers safetensors
      - name: Test the in-process kinds (downloads small public models)
        run: uv run --no-sync pytest -m encoder
