name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync (core + dev group)
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (unit, guards, sdk acceptance; live tests skip without a backend)
        run: uv run pytest -m "not live and not encoder"
      - name: Install as a tool and run it from another directory
        run: |
          uv tool install .
          cd "${RUNNER_TEMP}"
          jevify --version
