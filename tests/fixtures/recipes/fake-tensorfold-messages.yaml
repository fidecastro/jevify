# Test recipe: a chat-template ("messages" mode) decoder on a server that refuses reply-token
# logprobs but serves vLLM's prompt_logprobs on /v1/completions, where it also takes a chat
# `messages` list (TensorFold's native server with GLM-5.3-Flash). The mode that carries images.
schema_version: 1
model:
  name: fake-glm
  kind: endpoint
endpoint:
  base_url: http://fake/v1
  dialect: generic
  timeout_s: 30
template:
  mode: messages
  system: "You answer typed questions about the state with a single word."
  state: "State:\n{state}"
  state_end: "\n\n"
  questions:
    choice: "Question: {instructions}\nOptions:\n{options}\nAnswer with the identifier of the best option."
    option_line: "{identifier}. {key}{description}"
    description_sep: ": "
    score: "Question: {instructions}\nLevels:\n{levels}\nAnswer with the identifier of the level that applies."
    level_line: "{identifier}. {text}"
    noul: "Question: {instructions}\nAnswer with exactly one word, yes or no."
answers:
  noul:
    "true":
      - { text: "yes", id: 16520 }
    "false":
      - { text: "no", id: 3567 }
  identifiers:
    - [{ text: "A", id: 35 }]
    - [{ text: "B", id: 36 }]
    - [{ text: "C" }]
readout:
  rung: auto
  top_k: 10
  permutation: none
provenance:
  author: tests
  created: "2026-11-06"
  status: draft
